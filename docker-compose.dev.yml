version: '3.8'

services:
  # Laravel Application (Development)
  app:
    build:
      target: development
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_MODE=debug
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
    volumes:
      # Mount source code for live editing
      - ./:/var/www/html:cached
      - ./storage:/var/www/html/storage:delegated
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:delegated
      # Mount Xdebug logs
      - ./storage/logs/xdebug:/var/www/html/storage/logs/xdebug:delegated
    ports:
      - "${APP_PORT:-8000}:80"
      - "9003:9003" # Xdebug port

  # MySQL (Development with more verbose logging)
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-unas_fest_2025}
      MYSQL_USER: ${DB_USERNAME:-unas_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    command: >
      --general-log=1
      --general-log-file=/var/lib/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=1
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      # Mount logs for easier access
      - ./storage/logs/mysql:/var/lib/mysql:delegated

  # Redis (Development)
  redis:
    command: redis-server --appendonly yes --loglevel verbose

  # Queue Worker (Development)
  queue:
    build:
      target: development
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./:/var/www/html:cached
      - ./storage:/var/www/html/storage:delegated
    command: php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3 --rest=1

  # Scheduler (Development)
  scheduler:
    build:
      target: development
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    volumes:
      - ./:/var/www/html:cached
      - ./storage:/var/www/html/storage:delegated

  # Additional development services
  
  # MailHog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: unas_fest_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI port
    networks:
      - unas_fest_network

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: unas_fest_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-unas_user}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - unas_fest_network

  # Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: unas_fest_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - unas_fest_network

volumes:
  mysql_dev_data:
    driver: local
