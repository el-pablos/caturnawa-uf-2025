<svg width="850" height="1124" viewBox="0 0 850 1124" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="850" height="1124" fill="white"/>

  <!-- Header Background - Made wider -->
  <rect x="0" y="0" width="850" height="200" fill="#154C8C"/>

  <!-- Header Content -->
  <text x="50" y="60" fill="white" font-family="Arial, sans-serif" font-size="36" font-weight="bold">INVOICE</text>
  <text x="50" y="90" fill="white" font-family="Arial, sans-serif" font-size="16">UNAS FEST 2025</text>
  <text x="50" y="110" fill="white" font-family="Arial, sans-serif" font-size="14">Festival Kompetisi Nasional</text>

  <!-- Logo Placeholder -->
  <rect x="700" y="30" width="120" height="80" fill="none" stroke="white" stroke-width="2"/>
  <text x="760" y="75" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">LOGO</text>

  <!-- Main Content Area -->
  <rect x="30" y="230" width="790" height="400" fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Invoice Details Section -->
  <text x="50" y="250" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">INVOICE NUMBER</text>
  <text x="50" y="270" fill="#154C8C" font-family="Arial, sans-serif" font-size="12" font-weight="bold">{{INVOICE_NUMBER}}</text>

  <text x="450" y="250" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">DATE</text>
  <text x="450" y="270" fill="#154C8C" font-family="Arial, sans-serif" font-size="12" font-weight="bold">{{INVOICE_DATE}}</text>

  <!-- Participant Information -->
  <text x="50" y="300" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PARTICIPANT NAME</text>
  <text x="50" y="320" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PARTICIPANT_NAME}}</text>

  <text x="450" y="300" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">INSTITUTION</text>
  <text x="450" y="320" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PARTICIPANT_INSTITUTION}}</text>

  <text x="50" y="350" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">EMAIL</text>
  <text x="50" y="370" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PARTICIPANT_EMAIL}}</text>

  <text x="450" y="350" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PHONE</text>
  <text x="450" y="370" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PARTICIPANT_PHONE}}</text>

  <!-- Competition Information -->
  <text x="50" y="400" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">COMPETITION</text>
  <text x="50" y="420" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{COMPETITION_NAME}}</text>

  <text x="450" y="400" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">CATEGORY</text>
  <text x="450" y="420" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{COMPETITION_CATEGORY}}</text>

  <!-- Payment Information -->
  <text x="50" y="450" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">ORIGINAL PRICE</text>
  <text x="50" y="470" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{ORIGINAL_PRICE}}</text>

  <text x="450" y="450" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">DISCOUNT</text>
  <text x="450" y="470" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{DISCOUNT_AMOUNT}}</text>

  <text x="50" y="500" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">FINAL AMOUNT</text>
  <text x="50" y="520" fill="#16a34a" font-family="Arial, sans-serif" font-size="14" font-weight="bold">{{FINAL_AMOUNT}}</text>

  <text x="450" y="500" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PAYMENT METHOD</text>
  <text x="450" y="520" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PAYMENT_METHOD}}</text>

  <text x="50" y="550" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">STATUS</text>
  <text x="50" y="570" fill="#16a34a" font-family="Arial, sans-serif" font-size="12" font-weight="bold">{{PAYMENT_STATUS}}</text>

  <text x="450" y="550" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">PAYMENT DATE</text>
  <text x="450" y="570" fill="#154C8C" font-family="Arial, sans-serif" font-size="12">{{PAYMENT_DATE}}</text>

  <!-- Separator Lines -->
  <line x1="50" y1="285" x2="800" y2="285" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="335" x2="800" y2="335" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="385" x2="800" y2="385" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="435" x2="800" y2="435" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="485" x2="800" y2="485" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="535" x2="800" y2="535" stroke="#E5E7EB" stroke-width="1"/>
  <line x1="50" y1="585" x2="800" y2="585" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Vertical separator -->
  <line x1="425" y1="230" x2="425" y2="630" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Notes Section -->
  <text x="50" y="660" fill="#6B7280" font-family="Arial, sans-serif" font-size="10" font-weight="bold">NOTES</text>
  <text x="50" y="680" fill="#154C8C" font-family="Arial, sans-serif" font-size="10">{{NOTES}}</text>

  <!-- Footer -->
  <text x="50" y="750" fill="#6B7280" font-family="Arial, sans-serif" font-size="12" font-weight="bold">Thank you for participating in UNAS FEST 2025!</text>
  <text x="50" y="770" fill="#6B7280" font-family="Arial, sans-serif" font-size="10">For questions, contact: {{CONTACT_PERSON}} | {{CONTACT_WHATSAPP}}</text>

  <!-- Footer line -->
  <line x1="50" y1="800" x2="800" y2="800" stroke="#154C8C" stroke-width="2"/>
</svg>
