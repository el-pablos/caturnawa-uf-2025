<?xml version="1.0" encoding="UTF-8"?>
<svg width="794" height="1123" viewBox="0 0 794 1123" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Invoice Template Background -->
<rect width="794" height="1123" fill="white"/>

<!-- Header -->
<rect x="50" y="50" width="694" height="120" fill="#2563eb"/>
<text x="70" y="90" fill="white" font-family="Arial" font-size="24" font-weight="bold">UNAS FEST 2025</text>
<text x="70" y="115" fill="white" font-family="Arial" font-size="14">Invoice Pembayaran Kompetisi</text>

<!-- Logo placeholder -->
<rect x="600" y="60" width="100" height="80" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2"/>
<text x="640" y="105" fill="white" font-family="Arial" font-size="12" text-anchor="middle">LOGO</text>

<!-- Invoice Info -->
<text x="70" y="220" fill="#1f2937" font-family="Arial" font-size="18" font-weight="bold">INVOICE</text>
<text x="70" y="245" fill="#6b7280" font-family="Arial" font-size="12">Invoice No: {{INVOICE_NUMBER}}</text>
<text x="70" y="265" fill="#6b7280" font-family="Arial" font-size="12">Tanggal: {{INVOICE_DATE}}</text>
<text x="70" y="285" fill="#6b7280" font-family="Arial" font-size="12">Status: {{PAYMENT_STATUS}}</text>

<!-- Customer Info -->
<text x="400" y="220" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Peserta:</text>
<text x="400" y="245" fill="#374151" font-family="Arial" font-size="12">{{PARTICIPANT_NAME}}</text>
<text x="400" y="265" fill="#374151" font-family="Arial" font-size="12">{{PARTICIPANT_INSTITUTION}}</text>
<text x="400" y="285" fill="#374151" font-family="Arial" font-size="12">{{PARTICIPANT_EMAIL}}</text>
<text x="400" y="305" fill="#374151" font-family="Arial" font-size="12">{{PARTICIPANT_PHONE}}</text>

<!-- Line separator -->
<line x1="70" y1="340" x2="724" y2="340" stroke="#e5e7eb" stroke-width="1"/>

<!-- Table Header -->
<rect x="70" y="360" width="654" height="40" fill="#f3f4f6"/>
<text x="90" y="385" fill="#374151" font-family="Arial" font-size="12" font-weight="bold">Kompetisi</text>
<text x="400" y="385" fill="#374151" font-family="Arial" font-size="12" font-weight="bold">Kategori</text>
<text x="550" y="385" fill="#374151" font-family="Arial" font-size="12" font-weight="bold">Harga</text>
<text x="650" y="385" fill="#374151" font-family="Arial" font-size="12" font-weight="bold">Total</text>

<!-- Table Row -->
<rect x="70" y="400" width="654" height="40" fill="white" stroke="#e5e7eb" stroke-width="1"/>
<text x="90" y="425" fill="#374151" font-family="Arial" font-size="12">{{COMPETITION_NAME}}</text>
<text x="400" y="425" fill="#374151" font-family="Arial" font-size="12">{{COMPETITION_CATEGORY}}</text>
<text x="550" y="425" fill="#374151" font-family="Arial" font-size="12">{{ORIGINAL_PRICE}}</text>
<text x="650" y="425" fill="#374151" font-family="Arial" font-size="12">{{FINAL_AMOUNT}}</text>

<!-- Subtotal Section -->
<line x1="450" y1="470" x2="724" y2="470" stroke="#e5e7eb" stroke-width="1"/>
<text x="550" y="495" fill="#374151" font-family="Arial" font-size="12">Subtotal:</text>
<text x="650" y="495" fill="#374151" font-family="Arial" font-size="12">{{ORIGINAL_PRICE}}</text>

<text x="550" y="515" fill="#374151" font-family="Arial" font-size="12">Discount:</text>
<text x="650" y="515" fill="#374151" font-family="Arial" font-size="12">-{{DISCOUNT_AMOUNT}}</text>

<rect x="450" y="525" width="274" height="30" fill="#2563eb"/>
<text x="550" y="545" fill="white" font-family="Arial" font-size="14" font-weight="bold">TOTAL:</text>
<text x="650" y="545" fill="white" font-family="Arial" font-size="14" font-weight="bold">{{FINAL_AMOUNT}}</text>

<!-- Payment Method -->
<text x="70" y="600" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Metode Pembayaran:</text>
<text x="70" y="625" fill="#374151" font-family="Arial" font-size="12">{{PAYMENT_METHOD}}</text>

<!-- Instructions -->
<text x="70" y="680" fill="#1f2937" font-family="Arial" font-size="14" font-weight="bold">Instruksi:</text>
<text x="70" y="705" fill="#374151" font-family="Arial" font-size="12">1. Simpan invoice ini sebagai bukti pembayaran</text>
<text x="70" y="725" fill="#374151" font-family="Arial" font-size="12">2. Hubungi Contact Person di WhatsApp: {{CONTACT_WHATSAPP}}</text>
<text x="70" y="745" fill="#374151" font-family="Arial" font-size="12">3. Kirimkan screenshot invoice dan bukti pembayaran</text>
<text x="70" y="765" fill="#374151" font-family="Arial" font-size="12">4. Tunggu konfirmasi dari panitia</text>

<!-- Footer -->
<rect x="50" y="950" width="694" height="80" fill="#f3f4f6"/>
<text x="70" y="980" fill="#6b7280" font-family="Arial" font-size="12">UNAS Fest 2025 - Festival Kompetisi Universitas Nasional</text>
<text x="70" y="1000" fill="#6b7280" font-family="Arial" font-size="12">Website: https://unasfest.com | Email: info@unasfest.com</text>
<text x="70" y="1020" fill="#6b7280" font-family="Arial" font-size="12">WhatsApp: {{CONTACT_WHATSAPP}} | Instagram: @unasfest</text>

<!-- QR Code placeholder -->
<rect x="600" y="960" width="60" height="60" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
<text x="630" y="995" fill="#6b7280" font-family="Arial" font-size="8" text-anchor="middle">QR</text>
</svg>