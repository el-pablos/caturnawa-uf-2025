name: Deploy to Production

on:
  push:
    branches: [ master, tes ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, mysql, gd
        coverage: none
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
    - name: Cache composer dependencies
      uses: actions/cache@v3
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
        
    - name: Create Laravel cache directories
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/cache/data
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/views
        chmod -R 755 bootstrap/cache storage/framework

    - name: Install PHP dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction
      
    - name: Clear npm cache
      run: npm cache clean --force

    - name: Install Node.js dependencies
      run: npm install
      
    - name: Build assets
      run: npm run build

    - name: Prepare for archive creation
      run: |
        echo "Syncing file system..."
        sync
        sleep 2
        echo "File system sync completed"

    - name: Create deployment archive
      run: |
        tar --warning=no-file-changed --warning=no-file-removed -czf deployment.tar.gz \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='.env.example' \
          --exclude='README.md' \
          --exclude='*.md' \
          --exclude='deployment.tar.gz' \
          . || { echo "Archive creation completed with warnings (expected)"; exit 0; }
          
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      continue-on-error: false
      with:
        host: 146.190.107.60
        username: root
        password: vpsTaman1ch
        port: 22
        timeout: 300s
        command_timeout: 600s
        script_stop: true
        script: |
          # Set variables
          PROJECT_DIR="/root/work/project-uf/caturnawa-uf-2025"
          BACKUP_DIR="/root/backups/caturnawa-$(date +%Y%m%d-%H%M%S)"
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Update system and install PHP 8.2
          echo "Updating system and installing PHP 8.2..."
          apt update -y
          apt install -y software-properties-common
          add-apt-repository ppa:ondrej/php -y
          apt update -y
          apt install -y php8.2 php8.2-cli php8.2-fpm php8.2-mysql php8.2-xml php8.2-curl php8.2-gd php8.2-mbstring php8.2-zip php8.2-intl php8.2-bcmath
          
          # Install Composer if not exists
          if [ ! -f /usr/local/bin/composer ]; then
            echo "Installing Composer..."
            curl -sS https://getcomposer.org/installer | php
            mv composer.phar /usr/local/bin/composer
            chmod +x /usr/local/bin/composer
          fi
          
          # Create backup
          echo "Creating backup..."
          mkdir -p /root/backups
          cp -r $PROJECT_DIR $BACKUP_DIR
          
          # Navigate to project directory
          cd $PROJECT_DIR
          
          # Pull latest changes
          echo "Pulling latest changes..."
          git fetch origin
          echo "Deploying from branch: $BRANCH_NAME"
          git reset --hard origin/$BRANCH_NAME
          
          # Install/update dependencies
          echo "Installing PHP dependencies..."
          php8.2 /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
          php8.2 /usr/local/bin/composer dump-autoload --optimize
          
          echo "Installing Node.js dependencies..."
          npm cache clean --force
          npm install

          echo "Building assets..."
          npm run build
          
          # Fix permissions
          echo "Fixing permissions..."
          chmod 755 /root /root/work /root/work/project-uf
          chown -R www-data:www-data storage bootstrap/cache
          chmod -R 775 storage bootstrap/cache
          mkdir -p storage/framework/views
          chown -R www-data:www-data storage/framework/views
          chmod -R 775 storage/framework/views
          
          # Ensure .env file exists and is properly configured
          echo "Checking environment configuration..."
          if [ ! -f .env ]; then
            echo "Creating .env from .env.example..."
            cp .env.example .env
            echo "⚠️  WARNING: .env created from template"
          fi
          
          # Generate APP_KEY if missing
          if grep -q "APP_KEY=base64:PLEASE_GENERATE_NEW_KEY_WITH_php_artisan_key_generate" .env; then
            echo "Generating new APP_KEY..."
            php8.2 artisan key:generate --force
          fi
          
          # Ensure proper production settings
          sed -i 's/APP_ENV=.*/APP_ENV=production/' .env
          sed -i 's/APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's|APP_URL=.*|APP_URL=https://testing.caturnawa.unasfest.com|' .env
          
          # Clear caches and optimize Laravel
          echo "Clearing caches and optimizing Laravel..."
          rm -rf bootstrap/cache/config.php bootstrap/cache/routes.php bootstrap/cache/services.php
          rm -rf storage/framework/cache/data/* storage/framework/views/*
          
          # Run Laravel optimization commands with error handling
          echo "Running Laravel optimization commands..."
          php8.2 artisan config:clear || { echo "Config clear failed"; exit 1; }
          php8.2 artisan route:clear || { echo "Route clear failed"; exit 1; }
          php8.2 artisan view:clear || { echo "View clear failed"; exit 1; }
          php8.2 artisan cache:clear || { echo "Cache clear failed"; exit 1; }
          
          # Test basic Laravel functionality before caching
          echo "Testing Laravel configuration..."
          php8.2 artisan --version || { echo "Laravel is not working properly"; exit 1; }
          
          # Only cache if no errors in clearing
          php8.2 artisan config:cache || { echo "Config cache failed - check .env file"; exit 1; }
          php8.2 artisan route:cache || { echo "Route cache failed"; exit 1; }
          php8.2 artisan view:cache || { echo "View cache failed"; exit 1; }
          
          # Test deployment with multiple checks
          echo "Testing deployment..."
          
          # Wait for services to stabilize
          sleep 5
          
          # Test homepage
          response=$(curl -s -o /dev/null -w "%{http_code}" "https://testing.caturnawa.unasfest.com")
          echo "Homepage response: HTTP $response"
          
          # Test admin login page
          admin_response=$(curl -s -o /dev/null -w "%{http_code}" "https://testing.caturnawa.unasfest.com/admin/login")
          echo "Admin login response: HTTP $admin_response"
          
          if [ "$response" = "200" ] && [ "$admin_response" = "200" ]; then
            echo "✅ Deployment successful! Website is responding correctly"
          else
            echo "❌ Deployment failed! Homepage: HTTP $response, Admin: HTTP $admin_response"
            echo "Rolling back..."
            rm -rf $PROJECT_DIR
            mv $BACKUP_DIR $PROJECT_DIR
            exit 1
          fi
          
          # Clean up old backups (keep last 5)
          echo "Cleaning up old backups..."
          cd /root/backups
          ls -t | tail -n +6 | xargs -r rm -rf
          
          echo "🚀 Deployment completed successfully!"
